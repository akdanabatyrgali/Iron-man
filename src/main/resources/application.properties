# Local coursework demonstration. No external DB installation required.
spring.application.name=IronMan-Web
server.port=8082
spring.datasource.url=jdbc:h2:file:./data/stark-history;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# Development console only. Do not expose this demo as a public service.
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
server.error.include-message=always
